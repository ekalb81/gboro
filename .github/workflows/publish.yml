# Refresh the village's data and publish the site.
#
# Nothing goes live until you choose a host by setting the repository variable DEPLOY_TARGET
# (Settings > Secrets and variables > Actions > Variables) to "github-pages" or "cloudflare".
# Until then this only runs on push or by hand, builds the site, and stops. See PUBLISHING.md.
# Pull requests are checked by .github/workflows/checks.yml before they get here.

name: Publish

on:
  push:
    branches: [main]
    # A merge that only touches notes, tests or the pull request checks changes nothing on the site, so it
    # does not publish. The next scheduled run picks up main as usual.
    paths-ignore:
      - '**.md'
      - 'test/**'
      - '.github/dependabot.yml'
      - '.github/workflows/checks.yml'
  schedule:
    # Best effort. GitHub starts scheduled runs late and skips many when it is busy: asked twice an hour it ran
    # about one in ten. So ask four times an hour, away from :00 and :30 when its queue is fullest, and take
    # what comes. A run that does start refreshes everything; one that is skipped costs nothing.
    - cron: '11,26,41,56 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Scheduled runs are skipped until a host is chosen, so they don't spend Actions minutes.
    if: github.event_name != 'schedule' || vars.DEPLOY_TARGET != ''
    # One build at a time. A push to main replaces a build that is still going, since that one is building an
    # older commit: two merges a minute apart used to collect and deploy twice. A scheduled or manual run never
    # stops another; it waits its turn. Deploys have their own group below and are never stopped part-way.
    concurrency:
      group: publish-build
      cancel-in-progress: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45 # most runs take a minute or two; the weekly model rebuild adds about 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Test
        run: |
          npm test
          python3 -m unittest tools/model/test_refresh.py

      # Every run starts from a clean checkout and refetches recent data, so raw posts (which name
      # private people) are never stored in git or in an Actions cache. Add new sources'
      # secrets here and list the collector in scripts/collectors.json.
      # The last good copy of each public source is kept between runs, in one cache, so an outage shows the
      # previous numbers instead of none: crime counts (citywide and per-division totals only, nothing personal),
      # the weather reading, the City's YouTube feed (YouTube's feeds sometimes answer 404 for a while),
      # restaurants and bars from OpenStreetMap (refreshed about once a week) and NCDOT's traffic counts
      # (about once a week). To keep another file, add its path to this step and to "Save the data".
      - name: Restore the last good data
        uses: actions/cache/restore@v6
        with:
          path: |
            public/data/crime.json
            public/data/weather.json
            public/data/eats.json
            public/data/traffic-volumes.json
            data/civic/youtube.xml
          key: site-data-${{ github.run_id }}
          restore-keys: site-data-

      # The downtown model (public/model/) is rebuilt from fresh OpenStreetMap data about once a week, and at once
      # when tools/model/ or data/model/ change. The rebuilt files are kept between runs and deployed, never
      # committed: this workflow cannot write to the repository. If the rebuild fails, the last good model (or the
      # one in git) is published and the run carries on. See tools/model/refresh.py.
      - name: Restore last model build
        uses: actions/cache/restore@v6
        with:
          path: data/model-build
          key: model-build-${{ github.run_id }}
          restore-keys: model-build-

      - name: Rebuild the model if it is due
        id: model
        continue-on-error: true
        env:
          MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
        run: |
          # Exit status 10 means a rebuild is due and the Python packages it needs are not installed yet,
          # so the half-hourly runs that only reuse the last build skip the install.
          status=0
          python3 tools/model/refresh.py --publish || status=$?
          if [ "$status" = 10 ]; then
            pip install --quiet numpy pillow scipy shapely pyarrow
            python3 tools/model/refresh.py --publish
          elif [ "$status" != 0 ]; then
            exit "$status"
          fi

      - name: Save model build
        if: steps.model.outputs.changed == 'true' && hashFiles('data/model-build/built.json') != ''
        uses: actions/cache/save@v6
        with:
          path: data/model-build
          key: model-build-${{ github.run_id }}

      - name: Collect data and ingest
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          FBI_API_KEY: ${{ secrets.FBI_API_KEY }}
          DRIVENC_KEY: ${{ secrets.DRIVENC_KEY }}
        run: node scripts/refresh.mjs

      - name: Save the data for the next run
        uses: actions/cache/save@v6
        with:
          path: |
            public/data/crime.json
            public/data/weather.json
            public/data/eats.json
            public/data/traffic-volumes.json
            data/civic/youtube.xml
          key: site-data-${{ github.run_id }}

      # Fails the run, so nothing is deployed, if a page or data file is missing or private data is in public/.
      - name: Check the site has its files
        run: node scripts/check-site.mjs

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
          retention-days: 1

  deploy-github-pages:
    needs: build
    if: vars.DEPLOY_TARGET == 'github-pages'
    concurrency:
      group: publish-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  deploy-cloudflare:
    needs: build
    if: vars.DEPLOY_TARGET == 'cloudflare'
    concurrency:
      group: publish-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: site
      - name: Unpack
        run: tar -xf site/artifact.tar -C site && rm site/artifact.tar
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PROJECT || 'gso-village' }} --branch=main
