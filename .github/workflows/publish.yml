# Refresh the village's data and publish the site.
#
# Nothing goes live until you choose a host by setting the repository variable DEPLOY_TARGET
# (Settings > Secrets and variables > Actions > Variables) to "github-pages" or "cloudflare".
# Until then this only runs on push or by hand, builds the site, and stops. See PUBLISHING.md.

name: Publish

on:
  push:
    branches: [main]
  schedule:
    - cron: '7,37 * * * *' # every 30 minutes, off the top of the hour when GitHub's queue is busiest
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    # Scheduled runs are skipped until a host is chosen, so they don't spend Actions minutes.
    if: github.event_name != 'schedule' || vars.DEPLOY_TARGET != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45 # most runs take a minute or two; the weekly model rebuild adds about 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test
        run: |
          npm test
          python3 -m unittest tools/model/test_refresh.py

      # Every run starts from a clean checkout and refetches recent data, so raw posts (which name
      # private people) are never stored in git or in an Actions cache. Add new sources'
      # secrets here and list the collector in scripts/collectors.json.
      # The last good crime counts (citywide and per-division totals only, nothing personal) are kept
      # between runs, so an FBI or City outage shows the previous numbers instead of none.
      - name: Restore last crime counts
        uses: actions/cache/restore@v4
        with:
          path: public/data/crime.json
          key: crime-${{ github.run_id }}
          restore-keys: crime-

      # Same for the last weather reading (public NWS data), so a weather.gov outage keeps the last sky.
      - name: Restore last weather
        uses: actions/cache/restore@v4
        with:
          path: public/data/weather.json
          key: weather-${{ github.run_id }}
          restore-keys: weather-

      # The City's YouTube feed (public videos only) is kept between runs, because YouTube's feeds
      # sometimes answer 404 for a while; civic.mjs falls back to the last good copy.
      - name: Restore last City YouTube feed
        uses: actions/cache/restore@v4
        with:
          path: data/civic/youtube.xml
          key: civic-youtube-${{ github.run_id }}
          restore-keys: civic-youtube-

      # Restaurants and bars from OpenStreetMap (public business listings) are refreshed about once a day,
      # so the last copy is kept between runs and the collector skips the fetch while it is fresh.
      - name: Restore last restaurants and bars
        uses: actions/cache/restore@v4
        with:
          path: public/data/eats.json
          key: eats-${{ github.run_id }}
          restore-keys: eats-

      # NCDOT's average daily traffic counts (public, yearly figures) are refreshed about once a week.
      - name: Restore last traffic volumes
        uses: actions/cache/restore@v4
        with:
          path: public/data/traffic-volumes.json
          key: traffic-volumes-${{ github.run_id }}
          restore-keys: traffic-volumes-

      # The downtown model (public/model/) is rebuilt from fresh OpenStreetMap data about once a week, and at once
      # when tools/model/ or data/model/ change. The rebuilt files are kept between runs and deployed, never
      # committed: this workflow cannot write to the repository. If the rebuild fails, the last good model (or the
      # one in git) is published and the run carries on. See tools/model/refresh.py.
      - name: Restore last model build
        uses: actions/cache/restore@v4
        with:
          path: data/model-build
          key: model-build-${{ github.run_id }}
          restore-keys: model-build-

      - name: Rebuild the model if it is due
        id: model
        continue-on-error: true
        env:
          MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
        run: |
          # Exit status 10 means a rebuild is due and the Python packages it needs are not installed yet,
          # so the half-hourly runs that only reuse the last build skip the install.
          status=0
          python3 tools/model/refresh.py --publish || status=$?
          if [ "$status" = 10 ]; then
            pip install --quiet numpy pillow scipy shapely pyarrow
            python3 tools/model/refresh.py --publish
          elif [ "$status" != 0 ]; then
            exit "$status"
          fi

      - name: Save model build
        if: steps.model.outputs.changed == 'true' && hashFiles('data/model-build/built.json') != ''
        uses: actions/cache/save@v4
        with:
          path: data/model-build
          key: model-build-${{ github.run_id }}

      - name: Collect data and ingest
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          FBI_API_KEY: ${{ secrets.FBI_API_KEY }}
          DRIVENC_KEY: ${{ secrets.DRIVENC_KEY }}
        run: node scripts/refresh.mjs

      - name: Save crime counts
        if: hashFiles('public/data/crime.json') != ''
        uses: actions/cache/save@v4
        with:
          path: public/data/crime.json
          key: crime-${{ github.run_id }}

      - name: Save weather
        if: hashFiles('public/data/weather.json') != ''
        uses: actions/cache/save@v4
        with:
          path: public/data/weather.json
          key: weather-${{ github.run_id }}

      - name: Save City YouTube feed
        if: hashFiles('data/civic/youtube.xml') != ''
        uses: actions/cache/save@v4
        with:
          path: data/civic/youtube.xml
          key: civic-youtube-${{ github.run_id }}

      - name: Save restaurants and bars
        if: hashFiles('public/data/eats.json') != ''
        uses: actions/cache/save@v4
        with:
          path: public/data/eats.json
          key: eats-${{ github.run_id }}

      - name: Save traffic volumes
        if: hashFiles('public/data/traffic-volumes.json') != ''
        uses: actions/cache/save@v4
        with:
          path: public/data/traffic-volumes.json
          key: traffic-volumes-${{ github.run_id }}

      - name: Check the site has its files
        run: |
          for f in public/index.html public/village.js public/data/map.json public/data/items.json public/model/downtown.json; do
            test -s "$f" || { echo "::error::$f is missing"; exit 1; }
          done
          # Held items and raw digests must never be in the published folder.
          if find public -name 'held.json' -o -name '*.txt' | grep -q .; then echo "::error::private data in public/"; exit 1; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
          retention-days: 1

  deploy-github-pages:
    needs: build
    if: vars.DEPLOY_TARGET == 'github-pages'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  deploy-cloudflare:
    needs: build
    if: vars.DEPLOY_TARGET == 'cloudflare'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: site
      - name: Unpack
        run: tar -xf site/artifact.tar -C site && rm site/artifact.tar
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PROJECT || 'gso-village' }} --branch=main
