# Refresh the village's data and publish the site.
#
# Nothing goes live until you choose a host by setting the repository variable DEPLOY_TARGET
# (Settings > Secrets and variables > Actions > Variables) to "github-pages" or "cloudflare".
# Until then this only runs on push or by hand, builds the site, and stops. See PUBLISHING.md.

name: Publish

on:
  push:
    branches: [main]
  schedule:
    - cron: '7,37 * * * *' # every 30 minutes, off the top of the hour when GitHub's queue is busiest
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    # Scheduled runs are skipped until a host is chosen, so they don't spend Actions minutes.
    if: github.event_name != 'schedule' || vars.DEPLOY_TARGET != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test
        run: npm test

      # Every run starts from a clean checkout and refetches recent data, so raw posts (which name
      # private people) are never stored in git or in an Actions cache. Add new sources'
      # secrets here and list the collector in scripts/collectors.json.
      # The last good crime counts (citywide and per-division totals only, nothing personal) are kept
      # between runs, so an FBI or City outage shows the previous numbers instead of none.
      - name: Restore last crime counts
        uses: actions/cache/restore@v4
        with:
          path: public/data/crime.json
          key: crime-${{ github.run_id }}
          restore-keys: crime-

      # Same for the last weather reading (public NWS data), so a weather.gov outage keeps the last sky.
      - name: Restore last weather
        uses: actions/cache/restore@v4
        with:
          path: public/data/weather.json
          key: weather-${{ github.run_id }}
          restore-keys: weather-

      - name: Collect data and ingest
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          FBI_API_KEY: ${{ secrets.FBI_API_KEY }}
        run: node scripts/refresh.mjs

      - name: Save crime counts
        if: hashFiles('public/data/crime.json') != ''
        uses: actions/cache/save@v4
        with:
          path: public/data/crime.json
          key: crime-${{ github.run_id }}

      - name: Save weather
        if: hashFiles('public/data/weather.json') != ''
        uses: actions/cache/save@v4
        with:
          path: public/data/weather.json
          key: weather-${{ github.run_id }}

      - name: Check the site has its files
        run: |
          for f in public/index.html public/village.js public/data/map.json public/data/items.json; do
            test -s "$f" || { echo "::error::$f is missing"; exit 1; }
          done
          # Held items and raw digests must never be in the published folder.
          if find public -name 'held.json' -o -name '*.txt' | grep -q .; then echo "::error::private data in public/"; exit 1; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
          retention-days: 1

  deploy-github-pages:
    needs: build
    if: vars.DEPLOY_TARGET == 'github-pages'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  deploy-cloudflare:
    needs: build
    if: vars.DEPLOY_TARGET == 'cloudflare'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: site
      - name: Unpack
        run: tar -xf site/artifact.tar -C site && rm site/artifact.tar
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PROJECT || 'gso-village' }} --branch=main
