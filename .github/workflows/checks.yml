# Check a pull request before it is merged: the tests, that every script parses, and that the site
# still builds. Merging to main publishes at once (publish.yml), so this is the only look
# a change gets first. It uses no secrets and cannot write anywhere, so it is safe on pull requests from forks.

name: Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same pull request replaces the run for the old one.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Test
        run: |
          npm test
          python3 -m unittest tools/model/test_refresh.py

      # The page's scripts have no tests of their own, so at least make sure each one parses.
      - name: Every script parses
        run: |
          for f in public/*.js scripts/*.mjs; do node --check "$f"; done
          python3 -m compileall -q tools

      # Build the site the way publishing does, from the sample digest and without the network, then run the
      # same check the deploy runs.
      - name: The site builds
        run: |
          node scripts/ingest.mjs test/fixtures
          node scripts/check-site.mjs
