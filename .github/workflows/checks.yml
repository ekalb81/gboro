# Check a pull request before it is merged: the tests, that every script parses, that the site
# still builds, and that its pages load in a browser. Merging to main publishes at once (publish.yml), so this is the only look
# a change gets first. It uses no secrets and cannot write anywhere, so it is safe on pull requests from forks.

name: Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same pull request replaces the run for the old one.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Test
        run: |
          npm test
          python3 -m unittest tools/model/test_refresh.py

      # The page's scripts have no tests of their own, so at least make sure each one parses.
      - name: Every script parses
        run: |
          for f in public/*.js scripts/*.mjs; do node --check "$f"; done
          python3 -m compileall -q tools

      # Build the site the way publishing does, from the sample digest and without the network, then run the
      # same check the deploy runs.
      - name: The site builds
        run: |
          node scripts/ingest.mjs test/fixtures
          node scripts/check-site.mjs

      # Open every page in the runner's own Chrome: fails if a page throws, one of its files is missing,
      # or the village draws nothing.
      - name: The pages load
        run: node scripts/smoke.mjs

      - name: Detect model changes
        id: changed
        run: |
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]] || ! git diff --quiet HEAD^1 HEAD -- tools/model/prep.py tools/model/test_prep.py; then
            echo "prep=true" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]] || ! git diff --quiet HEAD^1 HEAD -- public/ tools/model/ data/model/ 'scripts/audit-*' 'test/*.browser.mjs' .github/actions/audit-model .github/workflows/checks.yml package.json; then
            echo "model=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check parking geometry
        if: steps.changed.outputs.prep == 'true'
        run: |
          python3 -m pip install --quiet shapely
          python3 -m unittest tools/model/test_prep.py
      - name: Check modeled streets and traffic in Chrome
        if: steps.changed.outputs.model == 'true'
        uses: ./.github/actions/audit-model
