<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GSO Village</title>
<style>
  :root { --bg:#1d2421; --panel:#f3ead2; --ink:#2b2418; --muted:#7a6a4f; --edge:#5a432a; --accent:#c8553d; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace; }
  .wrap { display:flex; gap:12px; padding:12px; min-height:100vh; }
  .stage { flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:8px; }
  canvas { width:100%; height:auto; image-rendering:pixelated; border:4px solid var(--edge); border-radius:4px; background:#4f7a3a; cursor:default; }
  .bar { display:flex; justify-content:space-between; color:#e9dfc4; font-size:13px; gap:12px; flex-wrap:wrap; }
  .bar b { color:#ffd77a; }
  .alert { background:#8a2a1e; color:#fff3d0; border:3px solid #5a1a12; border-radius:4px; padding:6px 10px; font-size:13px; }
  .alert b { color:#ffd77a; }
  aside { flex:0 0 340px; background:var(--panel); border:4px solid var(--edge); border-radius:4px; padding:12px; overflow:auto; max-height:calc(100vh - 24px); }
  h1 { font-size:18px; margin:0 0 2px; letter-spacing:1px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:1px; margin:14px 0 6px; color:var(--muted); }
  .sub { color:var(--muted); font-size:12px; }
  ul { list-style:none; padding:0; margin:0; }
  li { padding:8px; border:2px solid transparent; border-radius:3px; cursor:pointer; }
  li:hover, li.on { border-color:var(--edge); background:#fff7e0; }
  li .t { font-weight:bold; }
  li .m { font-size:12px; color:var(--muted); }
  li a { color:var(--accent); font-size:12px; }
  .dot { display:inline-block; width:8px; height:8px; margin-right:6px; vertical-align:1px; }
  button.clear { font:inherit; font-size:12px; background:none; border:none; color:var(--accent); cursor:pointer; padding:0; }
  @media (max-width: 860px) { .wrap { flex-direction:column; } aside { flex:none; max-height:none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <div id="alert" class="alert" role="status" hidden></div>
    <canvas id="village" width="768" height="480" aria-label="Pixel map of Greensboro with markers for what's going on"></canvas>
    <div class="bar"><span><span id="clock"></span> <span id="weather"></span></span><span id="chatter"></span></div>
  </div>
  <aside>
    <h1>GSO Village</h1>
    <div class="sub" id="status">Loading…</div>
    <h2 id="listTitle">What's going on</h2>
    <div id="filter" class="sub" hidden></div>
    <ul id="list"></ul>
    <h2>On the roads</h2>
    <div class="sub" id="roadsSource"></div>
    <ul id="roads"></ul>
    <h2>About</h2>
    <p class="sub">A watch-only pixel village of Greensboro, NC. Items come from public posts gathered into a digest every 30 minutes. Posts by private individuals show no names. Each item links to its original post.</p>
  </aside>
</div>
<script type="module" src="village.js"></script>
<script type="module" src="crime.js"></script>
</body>
</html>
