<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A house up the street · GSO Village</title>
<meta name="description" content="One house north of downtown Greensboro, as a close-up model with a made-up day going on in it.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,600..800,100&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&display=swap">
<style>
  :root { --paper:#f4ead2; --paper-2:#fffaf0; --ink:#2a2320; --ink-muted:#6c5d4b; --edge:#3a2a20; --gold:#ffd23f; --red:#a63d2a;
    --display:"Fraunces",Georgia,serif; --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif; color-scheme:dark; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:#1b231e; color:var(--ink); font:15px/1.45 var(--body); overflow:hidden; }
  .stage { position:relative; height:100vh; height:100dvh; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; outline:none; cursor:grab; }
  canvas:active { cursor:grabbing; }
  canvas:focus-visible { box-shadow:inset 0 0 0 3px var(--gold); }
  .ico { width:1em; height:1em; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .float { position:absolute; z-index:2; }
  .card { top:14px; left:14px; max-width:min(360px, calc(100% - 28px)); background:var(--paper); padding:10px 16px 12px 14px; border-radius:12px; box-shadow:0 3px 0 var(--edge), 0 8px 24px rgba(0,0,0,.25); }
  .card a { color:var(--red); font-size:13px; font-weight:800; text-decoration:none; }
  .card a:hover { text-decoration:underline; }
  .card h1 { font:800 22px/1.1 var(--display); font-variation-settings:"SOFT" 100; margin:4px 0 2px; }
  .card .now { font-weight:800; }
  .card .sub { color:var(--ink-muted); font-size:13px; }
  .tools { right:14px; bottom:14px; display:flex; flex-direction:column; background:var(--paper); border-radius:12px; box-shadow:0 3px 0 var(--edge), 0 8px 20px rgba(0,0,0,.25); overflow:hidden; }
  .tools button { width:42px; height:42px; display:grid; place-items:center; border:0; background:none; color:var(--ink); cursor:pointer; font-size:20px; }
  .tools button + button { border-top:1px solid #e3d5b2; }
  .tools button:hover { background:var(--paper-2); }
  .note { left:14px; bottom:14px; max-width:calc(100% - 90px); background:rgba(28,22,36,.78); color:#f5ecd8; font-size:12px; padding:6px 12px; border-radius:999px; }
  @media (max-width:600px) { .card { top:10px; left:10px; padding:8px 12px; } .card h1 { font-size:18px; } .note { display:none; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="i-turn" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5"/></symbol>
</svg>
<main class="stage">
  <canvas id="house" tabindex="0" aria-label="A close-up model of one house and its yard. Drag to look around, scroll to zoom, press R to look from another corner."></canvas>
  <div class="float card">
    <a href="./">← Back downtown</a>
    <h1>A house up the street</h1>
    <div class="now" id="now" aria-live="polite">&nbsp;</div>
    <div class="sub" id="sub">&nbsp;</div>
  </div>
  <div class="float tools">
    <button id="zin" title="Zoom in" aria-label="Zoom in"><svg class="ico"><use href="#i-plus"/></svg></button>
    <button id="zout" title="Zoom out" aria-label="Zoom out"><svg class="ico"><use href="#i-minus"/></svg></button>
    <button id="turn" title="Look from another corner" aria-label="Look from another corner"><svg class="ico"><use href="#i-turn"/></svg></button>
  </div>
  <div class="float note">The day here is made up, not watched: it follows the clock and the weather.</div>
</main>
<script type="module">
import { startHouse } from './house.js';
const Q = new URLSearchParams(location.search);
const get = async (u) => { try { const r = await fetch(u, { cache: 'no-cache' }); return r.ok ? await r.json() : null; } catch { return null; } };
const pre = Q.get('weather');
const [lot, weather] = await Promise.all([
  get('model/house.json'),
  pre ? { precip: ['rain', 'snow', 'storm'].includes(pre) ? pre : 'none', sky: pre === 'clear' ? 'clear' : 'cloudy', tempF: pre === 'snow' ? 30 : 58, windMph: 8 } : get('data/weather.json'),
]);
const $ = (id) => document.getElementById(id);
const hhmm = (min) => { const h = Math.floor(min / 60) % 24, m = Math.floor(min % 60); return `${h % 12 || 12}:${String(m).padStart(2, '0')} ${h < 12 ? 'am' : 'pm'}`; };
const NEXT = { run: 'a run', walk: 'a walk', mow: 'the lawn', garden: 'the front beds', coffee: 'coffee outside', read: 'a book in the yard', fire: 'friends round the fire' };
const DAY = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
if (lot) {
  const h = startHouse({ canvas: $('house'), lot, weather, onSay: ({ say, clock, next }) => {
    $('now').textContent = say;
    $('sub').textContent = `${DAY[clock.day]}, ${hhmm(clock.min)}` + (next && NEXT[next.kind] ? ` · next: ${NEXT[next.kind]} about ${hhmm(next.t0)}` : '');
  } });
  $('zin').onclick = () => h.zoom(1); $('zout').onclick = () => h.zoom(-1); $('turn').onclick = () => h.rotate();
  if (!pre) setInterval(async () => { const w = await get('data/weather.json'); if (w) h.setWeather(w); }, 10 * 60e3);
} else $('now').textContent = 'The model did not load.';
</script>
</body>
</html>
